name: Assemble release assets in draft

on:
  workflow_dispatch:
    inputs:
      target_release_id:
        description: Numeric ID of the destination draft release.
        required: true
        type: string
      plan_asset_name:
        description: JSON assembly-plan asset attached to the destination draft.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: assemble-release-assets-${{ inputs.target_release_id }}
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble and verify assets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Assemble assets inside destination draft
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ASSET_NAME: ${{ inputs.plan_asset_name }}
          TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
        run: |
          set -Eeuo pipefail

          repo="${GITHUB_REPOSITORY}"
          if [[ ! "${TARGET_RELEASE_ID}" =~ ^[0-9]+$ ]]; then
            echo "target_release_id must be numeric" >&2
            exit 2
          fi

          target_json="$(gh api "repos/${repo}/releases/${TARGET_RELEASE_ID}")"
          target_tag="$(jq -r '.tag_name' <<<"${target_json}")"
          if [[ "$(jq -r '.draft' <<<"${target_json}")" != "true" ]]; then
            echo "destination release must remain a draft" >&2
            exit 2
          fi

          gh api --paginate --slurp \
            "repos/${repo}/releases/${TARGET_RELEASE_ID}/assets?per_page=100" \
            | jq '[.[][]]' > target-assets.json

          plan_count="$(
            jq --arg name "${PLAN_ASSET_NAME}" \
              '[.[] | select(.name == $name)] | length' \
              target-assets.json
          )"
          if [[ "${plan_count}" != "1" ]]; then
            echo "expected exactly one assembly-plan asset, found ${plan_count}" >&2
            exit 2
          fi
          plan_asset_id="$(
            jq -r --arg name "${PLAN_ASSET_NAME}" \
              '.[] | select(.name == $name) | .id' \
              target-assets.json
          )"
          gh api \
            --header 'Accept: application/octet-stream' \
            "repos/${repo}/releases/assets/${plan_asset_id}" > assembly-plan.json

          jq -e \
            --argjson target "${TARGET_RELEASE_ID}" \
            '
              def safe_name:
                type == "string"
                and length > 0
                and . != "."
                and . != ".."
                and (contains("/") | not)
                and (contains("\\") | not)
                and (explode | all(. >= 32 and . != 127));
              def valid_size:
                type == "number" and . >= 0 and floor == .;
              def valid_digest:
                type == "string" and test("^[0-9a-f]{64}$");

              .schemaVersion == 1
              and .targetReleaseId == $target
              and (.files | type == "array" and length > 0)
              and all(
                .files[];
                (.name | safe_name)
                and (.size | valid_size)
                and (.sha256 | valid_digest)
                and (.chunks | type == "array" and length > 0)
                and all(
                  .chunks[];
                  (.name | safe_name)
                  and (.size | valid_size)
                  and (.sha256 | valid_digest)
                )
                and (.size as $file_size | [.chunks[].size] | add == $file_size)
                and ([.chunks[].name] | length == (unique | length))
              )
              and ([.files[].name] | length == (unique | length))
              and (
                [.files[].chunks[].name]
                | length == (unique | length)
              )
              and (
                ([.files[].name] + [.files[].chunks[].name])
                | length == (unique | length)
              )
            ' \
            assembly-plan.json >/dev/null

          mkdir -p assembled chunks
          declare -a pending=()
          assembled_count=0
          already_present=0

          while IFS=$'\t' read -r name expected_size expected_sha256; do
            existing="$(
              jq -r --arg name "${name}" \
                '.[] | select(.name == $name) | [.state, .size, .digest] | @tsv' \
                target-assets.json
            )"
            if [[ -n "${existing}" ]]; then
              IFS=$'\t' read -r state remote_size remote_digest <<<"${existing}"
              if [[
                "${state}" != "uploaded"
                || "${remote_size}" != "${expected_size}"
                || "${remote_digest}" != "sha256:${expected_sha256}"
              ]]; then
                echo "destination release has a conflicting asset: ${name}" >&2
                exit 3
              fi
              already_present=$((already_present + 1))
              continue
            fi

            output_path="assembled/${name}"
            : > "${output_path}"
            while IFS=$'\t' read -r chunk_name chunk_size chunk_sha256; do
              matches="$(
                jq --arg name "${chunk_name}" \
                  '[.[] | select(.name == $name and .state == "uploaded")] | length' \
                  target-assets.json
              )"
              if [[ "${matches}" != "1" ]]; then
                echo "missing or incomplete chunk: ${chunk_name}" >&2
                exit 3
              fi
              chunk_id="$(
                jq -r --arg name "${chunk_name}" \
                  '.[] | select(.name == $name) | .id' \
                  target-assets.json
              )"
              chunk_path="chunks/${chunk_name}"
              gh api \
                --header 'Accept: application/octet-stream' \
                "repos/${repo}/releases/assets/${chunk_id}" > "${chunk_path}"
              actual_chunk_size="$(stat -c '%s' "${chunk_path}")"
              actual_chunk_sha256="$(sha256sum "${chunk_path}" | cut -d' ' -f1)"
              if [[
                "${actual_chunk_size}" != "${chunk_size}"
                || "${actual_chunk_sha256}" != "${chunk_sha256}"
              ]]; then
                echo "chunk verification failed: ${chunk_name}" >&2
                exit 3
              fi
              cat "${chunk_path}" >> "${output_path}"
            done < <(
              jq -r \
                --arg name "${name}" \
                '.files[]
                 | select(.name == $name)
                 | .chunks[]
                 | [.name, (.size | tostring), .sha256]
                 | @tsv' \
                assembly-plan.json
            )

            actual_size="$(stat -c '%s' "${output_path}")"
            actual_sha256="$(sha256sum "${output_path}" | cut -d' ' -f1)"
            if [[
              "${actual_size}" != "${expected_size}"
              || "${actual_sha256}" != "${expected_sha256}"
            ]]; then
              echo "assembled asset verification failed: ${name}" >&2
              exit 4
            fi
            pending+=("${output_path}")
            assembled_count=$((assembled_count + 1))
          done < <(
            jq -r \
              '.files[] | [.name, (.size | tostring), .sha256] | @tsv' \
              assembly-plan.json
          )

          if ((${#pending[@]} > 0)); then
            gh release upload "${target_tag}" \
              --repo "${repo}" \
              "${pending[@]}"
          fi

          gh api --paginate --slurp \
            "repos/${repo}/releases/${TARGET_RELEASE_ID}/assets?per_page=100" \
            | jq '[.[][]]' > final-assets.json

          while IFS=$'\t' read -r name expected_size expected_sha256; do
            matches="$(
              jq \
                --arg name "${name}" \
                --argjson size "${expected_size}" \
                --arg digest "sha256:${expected_sha256}" \
                '[
                  .[]
                  | select(
                      .name == $name
                      and .state == "uploaded"
                      and .size == $size
                      and .digest == $digest
                    )
                ] | length' \
                final-assets.json
            )"
            if [[ "${matches}" != "1" ]]; then
              echo "destination verification failed: ${name}" >&2
              exit 5
            fi
          done < <(
            jq -r \
              '.files[] | [.name, (.size | tostring), .sha256] | @tsv' \
              assembly-plan.json
          )

          while IFS= read -r chunk_name; do
            chunk_id="$(
              jq -r --arg name "${chunk_name}" \
                '.[] | select(.name == $name) | .id' \
                final-assets.json
            )"
            if [[ ! "${chunk_id}" =~ ^[0-9]+$ ]]; then
              echo "cannot clean up chunk without a numeric id: ${chunk_name}" >&2
              exit 6
            fi
            gh api --method DELETE \
              "repos/${repo}/releases/assets/${chunk_id}"
          done < <(jq -r '.files[].chunks[].name' assembly-plan.json)

          gh api --method DELETE \
            "repos/${repo}/releases/assets/${plan_asset_id}"

          {
            echo "### Draft asset assembly complete"
            echo
            echo "- Assembled assets: ${assembled_count}"
            echo "- Already present: ${already_present}"
            echo "- Temporary chunks removed"
            echo "- Destination remained a draft"
          } >> "${GITHUB_STEP_SUMMARY}"
